name: Deploy stack files

on:
  push:
    branches: [main]
    paths:
      - docker-compose.prod.yml
      - deploy/**
      - init/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy stack files
        run: |
          tar czf stack.tgz docker-compose.prod.yml deploy init
          scp stack.tgz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/mims/stack.tgz"

      - name: Apply
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "cd /opt/mims && tar xzf stack.tgz && rm stack.tgz && docker compose -f docker-compose.prod.yml up -d"
