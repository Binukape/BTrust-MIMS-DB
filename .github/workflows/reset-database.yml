name: Reset database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to delete all data and rebuild the database from init/'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RESET" ]; then
            echo "Confirmation was not RESET, nothing was changed"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy stack files
        run: |
          tar czf stack.tgz docker-compose.prod.yml deploy init
          scp stack.tgz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/mims/stack.tgz"

      - name: Rebuild the database
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' <<'EOF'
          set -e
          cd /opt/mims
          sudo chown -R "$(id -un)":"$(id -gn)" init deploy
          flock /tmp/mims-deploy.lock sh -c '
            tar xzf stack.tgz && rm stack.tgz
            docker compose -f docker-compose.prod.yml stop backend seed db
            docker compose -f docker-compose.prod.yml rm -f backend seed db
            docker volume rm btrust-mims_mims_db_data
            docker compose -f docker-compose.prod.yml up -d
          '
          EOF

      - name: Check the site
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://${{ secrets.VM_HOST }}/api/health" || true)
            if [ "$code" = "200" ]; then echo "site is healthy"; exit 0; fi
            sleep 10
          done
          echo "site did not become healthy"
          exit 1
